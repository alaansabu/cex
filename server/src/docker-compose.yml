services:
  redis:
    image: redis:alpine3.20
    container_name: cex-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cex-network

  mongo:
    image: mongo:8.0
    container_name: centrelised-exchange
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=cexadmin
      - MONGO_INITDB_ROOT_PASSWORD=admindb
    networks:
      - cex-network

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: cex-mongo-gui
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=centrelised-exchange
      - ME_CONFIG_MONGODB_ADMINUSERNAME=bdev1
      - ME_CONFIG_MONGODB_ADMINPASSWORD=xpulse200
      - ME_CONFIG_BASICAUTH_USERNAME=alan
      - ME_CONFIG_BASICAUTH_PASSWORD=mypass
    depends_on:
      - mongo
    networks:
      - cex-network

networks:
  cex-network:
    driver: bridge